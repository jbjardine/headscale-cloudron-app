name: Publish GHCR image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to test and publish, for example v0.29.4-2
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/jbjardine/headscale-cloudron-app

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: ref
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "A package release tag is required." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: gateway/go.sum

      - name: Run regression tests
        run: |
          python3 -m unittest discover -s tests -v
          for script in web/*.js; do node --check "$script"; done
          cd gateway
          go test -race ./...

      - name: Check Go dependencies for reachable vulnerabilities
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: headscale-cloudron-app:release-check
          pull: true

      - name: Test packaged API and persistence
        run: python3 scripts/smoke_image.py --check-tsnet --image headscale-cloudron-app:release-check

      - name: Test desktop and mobile UI
        env:
          HEADSCALE_QA_DIR: ${{ runner.temp }}/headscale-ui-qa
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
          node tests/browser/smoke.cjs headscale-cloudron-app:release-check


      - name: Save UI screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: headscale-ui-screenshots
          path: ${{ runner.temp }}/headscale-ui-qa/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Export the tested image
        run: |
          mkdir -p "$RUNNER_TEMP/headscale-release-image"
          docker save headscale-cloudron-app:release-check -o "$RUNNER_TEMP/headscale-release-image/image.tar"

      - name: Save the tested image
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ${{ runner.temp }}/headscale-release-image/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/headscale-release-image

      - name: Validate the release tag and load the tested image
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          docker load -i "$RUNNER_TEMP/headscale-release-image/image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag headscale-cloudron-app:release-check "${IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          docker tag headscale-cloudron-app:release-check "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
