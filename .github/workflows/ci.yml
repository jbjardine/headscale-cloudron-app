name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Cloudron CLI
        run: npm install -g cloudron

      - name: Verify Cloudron versions catalog
        run: cloudron versions verify

      - name: Check manifest/catalog coherence
        run: |
          python3 - <<'PY'
          import json

          with open("CloudronManifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          with open("CloudronVersions.json", encoding="utf-8") as handle:
              versions = json.load(handle)

          version = manifest["version"]
          entry = versions["versions"].get(version)
          if not entry:
              raise SystemExit(f"CloudronVersions.json is missing version {version}")

          catalog_manifest = entry["manifest"]
          expected_image = f"ghcr.io/jbjardine/headscale-cloudron-app:v{version}"
          if catalog_manifest.get("version") != version:
              raise SystemExit("manifest version mismatch")
          if catalog_manifest.get("dockerImage") != expected_image:
              raise SystemExit(f"unexpected dockerImage: {catalog_manifest.get('dockerImage')}")

          for field in ("addons", "capabilities", "udpPorts", "mediaLinks", "iconUrl"):
              if field not in catalog_manifest:
                  raise SystemExit(f"catalog manifest missing {field}")

          print("Cloudron catalog coherence OK")
          PY

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: gateway/go.sum

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Run regression tests
        run: |
          python3 -m unittest discover -s tests -v
          for script in web/*.js; do node --check "$script"; done
          cd gateway
          go test -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: headscale-cloudron-app:ci

      - name: Test packaged API and persistence
        run: python3 scripts/smoke_image.py --check-tsnet --image headscale-cloudron-app:ci

      - name: Test desktop and mobile UI
        env:
          HEADSCALE_QA_DIR: ${{ runner.temp }}/headscale-ui-qa
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
          node tests/browser/smoke.cjs headscale-cloudron-app:ci

      - name: Save UI screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: headscale-ui-screenshots
          path: ${{ runner.temp }}/headscale-ui-qa/*.png
          if-no-files-found: warn
          retention-days: 14

