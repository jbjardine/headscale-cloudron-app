name: Autopublish upstream updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: autopublish-upstream
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jbjardine/headscale-cloudron-app

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_artifact_id: ${{ steps.snapshot_upload.outputs.artifact-id }}
      source_sha256: ${{ steps.snapshot.outputs.sha256 }}
      tag: ${{ steps.bump.outputs.tag }}
      changed: ${{ steps.bump.outputs.changed }}
      needs_publish: ${{ steps.publication.outputs.needs_publish }}
      needs_image: ${{ steps.publication.outputs.needs_image }}
      needs_git: ${{ steps.publication.outputs.needs_git }}
      needs_release: ${{ steps.publication.outputs.needs_release }}

    steps:
      - name: Require main for automatic publication
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Automatic publication must run from the main branch."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: gateway/go.sum

      - name: Check upstream versions
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autoupdate_upstream.py

      - name: Verify generated update diff
        if: steps.bump.outputs.changed == 'true'
        run: |
          if git diff --quiet -- Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json; then
            echo "::error::Update script reported changed=true, but no release diff was produced."
            exit 1
          fi

          test -s "${{ steps.bump.outputs.release_notes_path }}"
          git diff -- Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json

      - name: Check publication state
        id: publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          set -euo pipefail

          artifact="headscale-cloudron-app-${RELEASE_TAG//\//-}.tar.gz"

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          release_exists=false
          asset_exists=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
            if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx "${artifact}" >/dev/null; then
              asset_exists=true
            fi
          fi

          image_exists=false
          if gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/headscale-cloudron-app/versions" --paginate --jq '.[].metadata.container.tags[]?' | grep -Fx "${RELEASE_TAG}" >/dev/null; then
            image_exists=true
          fi

          needs_git=false
          needs_image=false
          needs_release=false
          if [ "${CHANGED}" = "true" ] || [ "${tag_exists}" != "true" ]; then
            needs_git=true
          fi
          if [ "${CHANGED}" = "true" ] || [ "${image_exists}" != "true" ]; then
            needs_image=true
          fi
          if [ "${CHANGED}" = "true" ] || [ "${release_exists}" != "true" ] || [ "${asset_exists}" != "true" ]; then
            needs_release=true
          fi

          needs_publish=false
          if [ "${needs_git}" = "true" ] || [ "${needs_image}" = "true" ] || [ "${needs_release}" = "true" ]; then
            needs_publish=true
          fi

          {
            echo "artifact_name=${artifact}"
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
            echo "asset_exists=${asset_exists}"
            echo "image_exists=${image_exists}"
            echo "needs_git=${needs_git}"
            echo "needs_image=${needs_image}"
            echo "needs_release=${needs_release}"
            echo "needs_publish=${needs_publish}"
          } >> "${GITHUB_OUTPUT}"

          echo "tag_exists=${tag_exists} release_exists=${release_exists} asset_exists=${asset_exists} image_exists=${image_exists}"

      - name: Stop when fully up to date
        if: steps.publication.outputs.needs_publish != 'true'
        run: echo "No upstream updates or missing publication artifacts found."

      - name: Checkout existing tag for repair
        if: steps.bump.outputs.changed != 'true' && steps.publication.outputs.tag_exists == 'true' && (steps.publication.outputs.needs_image == 'true' || steps.publication.outputs.needs_release == 'true')
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: git checkout --detach "${RELEASE_TAG}"

      - name: Freeze generated sources before running dependency code
        if: steps.publication.outputs.needs_publish == 'true'
        id: snapshot
        run: |
          digest=$(python3 scripts/publication_bundle.py freeze "$RUNNER_TEMP/headscale-inputs/snapshot.tar.gz" --generated --notes)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Save original source snapshot
        if: steps.publication.outputs.needs_publish == 'true'
        id: snapshot_upload
        uses: actions/upload-artifact@v7
        with:
          name: frozen-source
          path: ${{ runner.temp }}/headscale-inputs/snapshot.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  candidate:
    needs: prepare
    if: needs.prepare.outputs.needs_publish == 'true'
    uses: ./.github/workflows/build-and-validate.yml
    with:
      source_artifact_id: ${{ needs.prepare.outputs.source_artifact_id }}
      source_sha256: ${{ needs.prepare.outputs.source_sha256 }}

  publish:
    needs: [prepare, candidate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Confirm main still matches the validated base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Main changed during validation. Start a new run from main."
            exit 1
          fi

      - name: Checkout the trusted base for the catalog commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download original inputs by immutable artifact ID
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.source_artifact_id }},${{ needs.candidate.outputs.image_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/headscale-inputs

      - name: Authenticate publication inputs and copy only release data
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
          IMAGE_SHA256: ${{ needs.candidate.outputs.image_sha256 }}
          IMAGE_ID: ${{ needs.candidate.outputs.image_id }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          NEEDS_GIT: ${{ needs.prepare.outputs.needs_git }}
        run: |
          set -euo pipefail
          [[ "$CHANGED" == 'true' || "$CHANGED" == 'false' ]]
          [[ "$NEEDS_GIT" == 'true' || "$NEEDS_GIT" == 'false' ]]
          if [ "$CHANGED" = 'true' ] && [ "$NEEDS_GIT" != 'true' ]; then
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          expected = os.environ['IMAGE_SHA256']
          with (Path(os.environ['RUNNER_TEMP']) / 'headscale-inputs/image.tar').open('rb') as handle:
              if not re.fullmatch(r'[0-9a-f]{64}', expected) or hashlib.file_digest(handle, 'sha256').hexdigest() != expected:
                  raise SystemExit('Image artifact digest mismatch')
          PY
          # This helper is from the reviewed base checkout, not the candidate.
          args=()
          if [ "$CHANGED" = 'true' ]; then args+=(--copy-to "$GITHUB_WORKSPACE"); fi
          python3 scripts/publication_bundle.py publication-data "$RUNNER_TEMP/headscale-inputs/snapshot.tar.gz" "$SOURCE_SHA256" "$RELEASE_TAG" "$RUNNER_TEMP/headscale-publication" "${args[@]}"
          docker load -i "$RUNNER_TEMP/headscale-inputs/image.tar"
          test "$(docker image inspect headscale-cloudron-app:candidate --format '{{.Id}}')" = "$IMAGE_ID"

      - name: Log in to GHCR
        if: needs.prepare.outputs.needs_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image before updating the catalog
        if: needs.prepare.outputs.needs_image == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag headscale-cloudron-app:candidate "${IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          docker tag headscale-cloudron-app:candidate "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Commit and tag automatic update
        if: needs.prepare.outputs.needs_git == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${CHANGED}" = "true" ]; then
            git add Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json
            if git diff --cached --quiet; then
              echo "::error::No staged release changes to commit."
              exit 1
            fi
            git commit -m "Publie automatiquement ${RELEASE_TAG}"
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            head_commit="$(git rev-parse HEAD)"
            if [ "${tag_commit}" != "${head_commit}" ]; then
              echo "::error::Local tag ${RELEASE_TAG} does not point at HEAD."
              exit 1
            fi
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          fi

          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release
        if: needs.prepare.outputs.needs_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/headscale-publication/release-notes.md
          RELEASE_ARTIFACT: ${{ runner.temp }}/headscale-publication/headscale-cloudron-app-${{ needs.prepare.outputs.tag }}.tar.gz
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_ARTIFACT}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_PATH}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              "${RELEASE_ARTIFACT}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_PATH}" \
              --latest
          fi
