name: Autopublish upstream updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: autopublish-upstream
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jbjardine/headscale-cloudron-app

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      changed: ${{ steps.bump.outputs.changed }}
      needs_publish: ${{ steps.publication.outputs.needs_publish }}
      needs_image: ${{ steps.publication.outputs.needs_image }}
      needs_git: ${{ steps.publication.outputs.needs_git }}
      needs_release: ${{ steps.publication.outputs.needs_release }}

    steps:
      - name: Require main for automatic publication
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Automatic publication must run from the main branch."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: gateway/go.sum

      - name: Check upstream versions
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autoupdate_upstream.py

      - name: Verify generated update diff
        if: steps.bump.outputs.changed == 'true'
        run: |
          if git diff --quiet -- Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json; then
            echo "::error::Update script reported changed=true, but no release diff was produced."
            exit 1
          fi

          test -s "${{ steps.bump.outputs.release_notes_path }}"
          git diff -- Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Cloudron CLI
        run: npm install -g cloudron

      - name: Verify Cloudron versions catalog
        run: cloudron versions verify

      - name: Check manifest/catalog coherence
        run: |
          python3 - <<'PY'
          import json

          with open("CloudronManifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          with open("CloudronVersions.json", encoding="utf-8") as handle:
              versions = json.load(handle)

          version = manifest["version"]
          entry = versions["versions"].get(version)
          if not entry:
              raise SystemExit(f"CloudronVersions.json is missing version {version}")

          catalog_manifest = entry["manifest"]
          expected_image = f"ghcr.io/jbjardine/headscale-cloudron-app:v{version}"
          if catalog_manifest.get("version") != version:
              raise SystemExit("manifest version mismatch")
          if catalog_manifest.get("dockerImage") != expected_image:
              raise SystemExit(f"unexpected dockerImage: {catalog_manifest.get('dockerImage')}")

          for field in ("addons", "capabilities", "udpPorts", "mediaLinks", "iconUrl"):
              if field not in catalog_manifest:
                  raise SystemExit(f"catalog manifest missing {field}")

          print("Cloudron catalog coherence OK")
          PY

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Check publication state
        id: publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          set -euo pipefail

          artifact="headscale-cloudron-app-${RELEASE_TAG//\//-}.tar.gz"

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          release_exists=false
          asset_exists=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
            if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fx "${artifact}" >/dev/null; then
              asset_exists=true
            fi
          fi

          image_exists=false
          if gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/headscale-cloudron-app/versions" --paginate --jq '.[].metadata.container.tags[]?' | grep -Fx "${RELEASE_TAG}" >/dev/null; then
            image_exists=true
          fi

          needs_git=false
          needs_image=false
          needs_release=false
          if [ "${CHANGED}" = "true" ] || [ "${tag_exists}" != "true" ]; then
            needs_git=true
          fi
          if [ "${CHANGED}" = "true" ] || [ "${image_exists}" != "true" ]; then
            needs_image=true
          fi
          if [ "${CHANGED}" = "true" ] || [ "${release_exists}" != "true" ] || [ "${asset_exists}" != "true" ]; then
            needs_release=true
          fi

          needs_publish=false
          if [ "${needs_git}" = "true" ] || [ "${needs_image}" = "true" ] || [ "${needs_release}" = "true" ]; then
            needs_publish=true
          fi

          {
            echo "artifact_name=${artifact}"
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
            echo "asset_exists=${asset_exists}"
            echo "image_exists=${image_exists}"
            echo "needs_git=${needs_git}"
            echo "needs_image=${needs_image}"
            echo "needs_release=${needs_release}"
            echo "needs_publish=${needs_publish}"
          } >> "${GITHUB_OUTPUT}"

          echo "tag_exists=${tag_exists} release_exists=${release_exists} asset_exists=${asset_exists} image_exists=${image_exists}"

      - name: Stop when fully up to date
        if: steps.publication.outputs.needs_publish != 'true'
        run: echo "No upstream updates or missing publication artifacts found."

      - name: Checkout existing tag for repair
        if: steps.bump.outputs.changed != 'true' && steps.publication.outputs.tag_exists == 'true' && (steps.publication.outputs.needs_image == 'true' || steps.publication.outputs.needs_release == 'true')
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: git checkout --detach "${RELEASE_TAG}"

      - name: Set up Docker Buildx
        if: steps.publication.outputs.needs_publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Run regression tests
        if: steps.publication.outputs.needs_publish == 'true'
        run: |
          python3 -m unittest discover -s tests -v
          for script in web/*.js; do node --check "$script"; done
          cd gateway
          go test -race ./...

      - name: Check Go dependencies for reachable vulnerabilities
        if: steps.publication.outputs.needs_publish == 'true'
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build candidate Docker image
        if: steps.publication.outputs.needs_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: headscale-cloudron-app:autopublish-check
          pull: true

      - name: Test packaged API and persistence
        if: steps.publication.outputs.needs_publish == 'true'
        run: python3 scripts/smoke_image.py --check-tsnet --image headscale-cloudron-app:autopublish-check

      - name: Test desktop and mobile UI
        if: steps.publication.outputs.needs_publish == 'true'
        env:
          HEADSCALE_QA_DIR: ${{ runner.temp }}/headscale-ui-qa
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
          node tests/browser/smoke.cjs headscale-cloudron-app:autopublish-check


      - name: Save UI screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: headscale-ui-screenshots
          path: ${{ runner.temp }}/headscale-ui-qa/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Export the tested publication candidate
        if: steps.publication.outputs.needs_publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          NEEDS_IMAGE: ${{ steps.publication.outputs.needs_image }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/headscale-publication"
          mkdir -p "$destination/source/gateway" "$destination/source/.github"
          for file in Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json; do
            install -m 644 "$file" "$destination/source/$file"
          done
          install -m 644 dist/autoupdate-release-notes.md "$destination/release-notes.md"
          tar \
            --exclude='.git' \
            --exclude='./.git' \
            --exclude='.github' \
            --exclude='./.github' \
            --exclude='.workflow' \
            --exclude='./.workflow' \
            --exclude='dist' \
            --exclude='./dist' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='__pycache__' \
            -czf "$destination/headscale-cloudron-app-${RELEASE_TAG}.tar.gz" .
          if [ "$NEEDS_IMAGE" = 'true' ]; then
            docker save headscale-cloudron-app:autopublish-check -o "$destination/image.tar"
          fi

      - name: Save publication candidate
        if: steps.publication.outputs.needs_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: autopublish-candidate
          path: ${{ runner.temp }}/headscale-publication/
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Confirm main still matches the validated base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Main changed during validation. Start a new run from main."
            exit 1
          fi

      - name: Checkout the trusted base for the catalog commit
        if: needs.prepare.outputs.needs_git == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the tested candidate
        uses: actions/download-artifact@v8
        with:
          name: autopublish-candidate
          path: ${{ runner.temp }}/headscale-publication

      - name: Validate publication data and copy only catalog files
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          NEEDS_IMAGE: ${{ needs.prepare.outputs.needs_image }}
          NEEDS_GIT: ${{ needs.prepare.outputs.needs_git }}
          NEEDS_RELEASE: ${{ needs.prepare.outputs.needs_release }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+', tag):
              raise SystemExit('Invalid release tag')
          for key in ('CHANGED', 'NEEDS_IMAGE', 'NEEDS_GIT', 'NEEDS_RELEASE'):
              if os.environ[key] not in ('true', 'false'):
                  raise SystemExit('Invalid publication flag')
          candidate = Path(os.environ['RUNNER_TEMP']) / 'headscale-publication'
          source = candidate / 'source'
          files = ('Dockerfile', 'gateway/go.mod', 'gateway/go.sum',
                   'CloudronManifest.json', 'CloudronVersions.json', 'README.md',
                   'CHANGELOG.md', '.github/upstream-state.json')
          for name in (*files, '../release-notes.md'):
              file = source / name
              if not file.is_file() or file.is_symlink() or not file.resolve().is_relative_to(candidate.resolve()):
                  raise SystemExit('Invalid publication file')
          manifest = json.loads((source / 'CloudronManifest.json').read_text())
          catalog = json.loads((source / 'CloudronVersions.json').read_text())
          version = tag.removeprefix('v')
          entry = catalog['versions'][version]
          expected_image = 'ghcr.io/jbjardine/headscale-cloudron-app:' + tag
          if manifest.get('id') != 'io.github.jbjardine.headscale-cloudron-app' or manifest.get('version') != version:
              raise SystemExit('Release manifest mismatch')
          if entry.get('publishState') != 'published' or entry['manifest'].get('dockerImage') != expected_image or entry['manifest'].get('version') != version:
              raise SystemExit('Release catalog mismatch')
          for flag, name in (('NEEDS_IMAGE', 'image.tar'), ('NEEDS_RELEASE', f'headscale-cloudron-app-{tag}.tar.gz')):
              file = candidate / name
              if os.environ[flag] == 'true' and (not file.is_file() or file.is_symlink()):
                  raise SystemExit('Missing publication artifact')
          if os.environ['CHANGED'] == 'true':
              if os.environ['NEEDS_GIT'] != 'true':
                  raise SystemExit('Changed catalog needs a Git commit')
              for name in files:
                  destination = Path(name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source / name, destination)
          PYTHON

      - name: Load the tested image without rebuilding
        if: needs.prepare.outputs.needs_image == 'true'
        run: docker load -i "$RUNNER_TEMP/headscale-publication/image.tar"

      - name: Log in to GHCR
        if: needs.prepare.outputs.needs_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image before updating the catalog
        if: needs.prepare.outputs.needs_image == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag headscale-cloudron-app:autopublish-check "${IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${IMAGE_NAME}:${RELEASE_TAG}"
          docker tag headscale-cloudron-app:autopublish-check "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Commit and tag automatic update
        if: needs.prepare.outputs.needs_git == 'true'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${CHANGED}" = "true" ]; then
            git add Dockerfile gateway/go.mod gateway/go.sum CloudronManifest.json CloudronVersions.json README.md CHANGELOG.md .github/upstream-state.json
            if git diff --cached --quiet; then
              echo "::error::No staged release changes to commit."
              exit 1
            fi
            git commit -m "Publie automatiquement ${RELEASE_TAG}"
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            head_commit="$(git rev-parse HEAD)"
            if [ "${tag_commit}" != "${head_commit}" ]; then
              echo "::error::Local tag ${RELEASE_TAG} does not point at HEAD."
              exit 1
            fi
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          fi

          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release
        if: needs.prepare.outputs.needs_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/headscale-publication/release-notes.md
          RELEASE_ARTIFACT: ${{ runner.temp }}/headscale-publication/headscale-cloudron-app-${{ needs.prepare.outputs.tag }}.tar.gz
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_ARTIFACT}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_PATH}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              "${RELEASE_ARTIFACT}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_PATH}" \
              --latest
          fi
